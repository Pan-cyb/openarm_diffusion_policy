# Local-path copy of the pinned official robot-pedestal module.
# Node arguments and wiring intentionally match upstream exactly.

module:
  name: robot-real-pedestal
  inputs:
    - tick
    - camera_tick
    - command
    - arm_command
    - position_right
    - position_left
    - joystick_y
    - button_x
    - pose_right
    - pose_left
  outputs:
    - state_right
    - state_left
    - arm_state_right
    - arm_state_left
    - status_right
    - status_left
    - camera_wrist_right
    - camera_wrist_left
    - camera_head_left
    - camera_head_right
    - camera_ceiling
    - elevation_action
    - elevation_observation

nodes:
  - id: right
    path: dora-openarm
    args: "--side right --align-trigger gripper --config openarm_pedestal"
    inputs:
      request_state: _mod/position_right
      move_position: _mod/position_right
      command: _mod/arm_command
    outputs:
      - state
      - status

  - id: left
    path: dora-openarm
    args: "--side left --align-trigger gripper --config openarm_pedestal"
    inputs:
      request_state: _mod/position_left
      move_position: _mod/position_left
      command: _mod/arm_command
    outputs:
      - state
      - status

  - id: arms
    path: dora-echo
    inputs:
      state_right: right/state
      state_left: left/state
      arm_state_right: right/state
      arm_state_left: left/state
      status_right: right/status
      status_left: left/status
    outputs:
      - state_right
      - state_left
      - arm_state_right
      - arm_state_left
      - status_right
      - status_left
      - elevation_action
      - elevation_observation

  - id: quittable-cameras
    path: dora-openarm-quitter
    inputs:
      command: _mod/command
    outputs:
      - camera_wrist_right
      - camera_wrist_left
      - camera_head_left
      - camera_head_right
      - camera_ceiling
