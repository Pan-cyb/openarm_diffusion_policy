# Quest WebXR leader for the real V2 pedestal dataflow.
#
# This keeps the pinned upstream WebXR and IK implementations, but serves the
# already validated local HTTP frontend through ADB reverse. Both WebRTC peers
# use LAN/USB host candidates only, avoiding the public STUN dependency.

module:
  name: leader-webxr-real-pedestal
  inputs:
    - tick
    - camera_head_left
    - camera_head_right
  outputs:
    - follower_position_right
    - follower_position_left
    - pose_right
    - pose_left
    - joystick_y_left
    - button_a
    - button_b
    - button_x
    - vr_receive_times
    - ker_position
    - metadata
    - arm_command

nodes:
  - id: webxr
    path: /home/pan/openarm_diffusion_policy/vr_teleoperation/upstream/dora-openarm-data-collection/.venv/bin/python
    env:
      ICE_SERVERS: "[]"
    args: >-
      /home/pan/openarm_diffusion_policy/vr_teleoperation/local/webxr_http_localhost.py
      --host 127.0.0.1
      --port 8080
      --view-configuration-file /home/pan/openarm_diffusion_policy/vr_teleoperation/local/view_webxr_pedestal.yaml
      --pose-timeout 0.2
    inputs:
      tick: _mod/tick
      camera_head_left:
        source: _mod/camera_head_left
        queue_size: 1
      camera_head_right:
        source: _mod/camera_head_right
        queue_size: 1
    outputs:
      - pose_right
      - trigger_right
      - pose_left
      - trigger_left
      - grip_right
      - grip_left
      - joystick_x_right
      - joystick_y_right
      - joystick_x_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - button_y
      - status
      - vr_receive_times
      - pose_reference
      - vr_arm_command

  - id: ik
    path: dora-openarm-ik
    args: >-
      --xml /home/pan/openarm_diffusion_policy/openarm_v2/vendor/openarm_mujoco/v2/pedestal/pedestal.xml
      --keyframe home
      --mode bimanual
      --tick-hz 250
      --max-iters 5
      --damping 0.1
      --posture-cost 0
      --lm-damping 0.01
      --limit-velocity
      --origin-frame arm_origin
      --origin-frame-type site
    inputs:
      target_right: webxr/pose_right
      target_left: webxr/pose_left
      trigger_right: webxr/trigger_right
      trigger_left: webxr/trigger_left
    outputs:
      - position_right
      - position_left
      - status

  - id: out
    path: dora-echo
    inputs:
      follower_position_right: ik/position_right
      follower_position_left: ik/position_left
      arm_command: webxr/vr_arm_command
    outputs:
      - follower_position_right
      - follower_position_left
      - ker_position
      - metadata
      - arm_command
