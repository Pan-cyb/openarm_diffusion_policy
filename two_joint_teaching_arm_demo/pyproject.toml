[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "two-joint-teaching-arm"
version = "0.1.0"
description = "Offline MuJoCo teaching-arm and mock MCU/CAN workflow"
requires-python = ">=3.10"
dependencies = [
  "imageio[ffmpeg]>=2.36",
  "mujoco==3.6.0",
  "numpy>=1.23,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
