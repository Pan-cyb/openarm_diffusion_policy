[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openarm-v2-mainline"
version = "0.1.0"
description = "OpenArm 2.0 pedestal MuJoCo learning and interface project"
requires-python = ">=3.10"
dependencies = [
  "mujoco==3.6.0",
  "numpy>=1.23,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
